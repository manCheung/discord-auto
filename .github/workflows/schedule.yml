name: Auto Send Discord Joke

on:
  # 允許在 GitHub 網頁手動點擊測試
  workflow_dispatch:
  # 定時排程（使用 UTC 時間：UTC 04:00 = 香港時間中午 12:00）
  schedule:
    - cron: '0 4 * * *'

jobs:
  send-joke:
    runs-on: ubuntu-latest
    steps:
      - name: 取得儲存庫檔案
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行發送笑話腳本
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python send_joke.py
