name: Discord Hourly Message

on:
  schedule:
    # 每 2 個鐘的第 8 分執行一次（避開整點延遲）
    - cron: '8 */2 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "阿初今日全日都冇出聲，大家唔會覺得好奇怪？"}' \
               "$WEBHOOK_URL"
